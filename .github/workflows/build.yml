name: build

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./...
      - run: make build VERSION=${GITHUB_SHA::12}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-static-binaries
          path: dist/
